name: Build unsigned IPA

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Published tag to sync to source.json instead of building an IPA
        type: string
        required: false
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  build:
    if: (github.event_name == 'workflow_dispatch' && inputs.release_tag == '') || (github.event_name == 'push' && !github.event.deleted)
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Generate Xcode project
        run: |
          xcodebuild -version
          brew install xcodegen
          xcodegen generate

      - name: Archive for iOS devices
        run: |
          xcodebuild archive \
            -project Anywhere.xcodeproj \
            -scheme Anywhere \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath "$RUNNER_TEMP/DerivedData" \
            -archivePath "$RUNNER_TEMP/Anywhere.xcarchive" \
            CODE_SIGNING_ALLOWED=NO

      - name: Package unsigned IPA
        run: |
          app="$RUNNER_TEMP/Anywhere.xcarchive/Products/Applications/Anywhere.app"
          test -x "$app/Anywhere"
          test ! -e "$app/embedded.mobileprovision"
          mkdir -p "$RUNNER_TEMP/package/Payload"
          ditto "$app" "$RUNNER_TEMP/package/Payload/Anywhere.app"
          ditto -c -k --keepParent "$RUNNER_TEMP/package/Payload" "$RUNNER_TEMP/Anywhere.ipa"
          unzip -tq "$RUNNER_TEMP/Anywhere.ipa"

      - name: Upload IPA
        uses: actions/upload-artifact@v7
        with:
          path: ${{ runner.temp }}/Anywhere.ipa
          archive: false
          if-no-files-found: error

  release:
    if: github.event_name == 'push' && github.ref_type == 'tag'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: Anywhere.ipa

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" Anywhere.ipa \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --title "Anywhere ${GITHUB_REF_NAME#v}" \
            --generate-notes

  sync-source:
    needs: release
    if: ${{ !cancelled() && (needs.release.result == 'success' || (github.event_name == 'workflow_dispatch' && inputs.release_tag != '')) }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main

      - name: Download published IPA
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}
        run: |
          gh release view --repo "$GITHUB_REPOSITORY" --json isDraft,isPrerelease,publishedAt \
            -- "$RELEASE_TAG" > "$RUNNER_TEMP/release.json"
          gh release download --repo "$GITHUB_REPOSITORY" --pattern Anywhere.ipa \
            --dir "$RUNNER_TEMP" -- "$RELEASE_TAG"

      - name: Update subscription on main
        env:
          RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

          for attempt in 1 2 3; do
            git fetch origin main
            git checkout -B main FETCH_HEAD
            python3 .github/scripts/update-source.py
            git add -- source.json
            if git diff --cached --quiet; then
              exit 0
            fi
            git commit -m "Update Anywhere source for $RELEASE_TAG"
            if git push origin HEAD:refs/heads/main; then
              exit 0
            fi
          done
          exit 1
